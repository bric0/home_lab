# values.yaml pour Cilium 1.18.6
namespace: kube-system

ipam:
  mode: kubernetes

kubeProxyReplacement: true

# Other we have the issue where the init-container of some cilium pods can't be run
sysctlfix:
  enabled: false

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445


l2announcements:
  enabled: true

gatewayAPI:
  enabled: true 
  enableAlpn: true 
  enableAppProtocol: true
