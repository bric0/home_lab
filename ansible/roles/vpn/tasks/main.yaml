---
- name: Setting up headscale
  block:
    - name: Download headscale debian package
      ansible.builtin.get_url:
        url: "https://github.com/juanfont/headscale/releases/download/v{{ headscale_version }}/headscale_{{ headscale_version }}_linux_{{ headscale_arch }}.deb"
        dest: /tmp/headscale.deb
        mode: '0644'

    - name: Install headscale debian package
      ansible.builtin.apt:
        deb: /tmp/headscale.deb

    - name: Deploy headscale configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/headscale/config.yaml
        owner: headscale
        group: headscale
        mode: '0644'
      notify: Restart headscale

    - name: Enable and start headscale service
      ansible.builtin.systemd_service:
        name: headscale
        state: started
        enabled: true
  become: true
