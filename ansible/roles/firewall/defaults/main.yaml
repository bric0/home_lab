---
# Management network
firewall_management_ip: "192.168.10.2/29"
firewall_management_gateway: "192.168.10.1"
firewall_dns_servers: "10.10.0.10"

# VLAN interfaces
firewall_vlans:
  - id: 10
    address: "10.10.0.1/24"
  - id: 20
    address: "10.20.0.1/24"
  - id: 30
    address: "10.30.0.1/24"
  - id: 40
    address: "10.40.0.1/16"

# Headscale VPN
headscale_url: "https://vpn.bricoo.fr"
tailscale_authkey: ""
advertise_routes:
  - "10.10.0.0/24"
  - "10.20.0.0/24"
  - "10.30.0.0/24"
  - "10.40.0.0/16"
  - "192.168.10.0/29"

# nftables DNAT rules on the firewall
firewall_dnat_rules:
  - comment: "Forward VPN traffic to headscale"
    iif: "eth1"
    proto: tcp
    dport: 443
    dest: "10.30.0.10:8080"

# DHCP relay (forward DHCP from prod VLAN to AdGuard)
dhcp_relay_server: "10.10.0.10"
dhcp_relay_interfaces:
  - "eth0.40"
  - "eth0.10"

# sysctl overrides (firewall is a router)
sysctl_settings:
  net.ipv4.ip_forward: 1
  net.ipv6.conf.all.disable_ipv6: 1
  net.ipv6.conf.default.disable_ipv6: 1
