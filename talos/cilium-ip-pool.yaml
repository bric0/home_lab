apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-pool
spec:
  blocks:
    - start: 10.40.0.200
      stop: 10.40.0.202
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-l2-policy
spec:
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
  - ^eth[0-9]+
  - ^ens[0-9]+
  - ^enp[0-9]+s[0-9]+

