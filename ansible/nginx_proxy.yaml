---
- name: Deploy Nginx reverse proxy configuration
  hosts: homelab-dmz-01
  become: true
  roles:
    - nginx_proxy

- name: Deploy Nginx stack via Portainer
  hosts: homelab-infra-01
  gather_facts: false
  tasks:
    - name: Load nginx_proxy defaults
      ansible.builtin.include_vars:
        file: roles/nginx_proxy/defaults/main.yaml

    - name: Authenticate to Portainer API
      ansible.builtin.include_role:
        name: portainer_api
        tasks_from: authenticate.yaml

    - name: Render Nginx docker-compose content
      ansible.builtin.set_fact:
        _nginx_compose: "{{ lookup('template', 'roles/nginx_proxy/templates/docker-compose.yaml.j2') }}"

    - name: Deploy Nginx stack
      ansible.builtin.include_role:
        name: portainer_api
        tasks_from: deploy_stack.yaml
      vars:
        stack:
          name: "nginx-proxy"
          endpoint_name: "homelab-dmz-01"
          compose_content: "{{ _nginx_compose }}"
