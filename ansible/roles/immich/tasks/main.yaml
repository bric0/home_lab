---
- name: Setting up Immich
  block:
    - name: Create Immich data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ immich_data_dir }}/upload"
        - "{{ immich_data_dir }}/postgres"
        - "{{ immich_data_dir }}/model-cache"
  become: true
