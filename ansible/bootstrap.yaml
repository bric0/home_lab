---
# Bootstrap playbook - deploys entire infra from scratch
# Usage: cd ansible && ansible-playbook bootstrap.yaml
# Prerequisites: PVE configured (pve.yaml), VMs deployed (opentofu)

#Step 1: Configure firewall (networking + nftables + install tailscale)
- name: Setup firewall
  hosts: homelab-firewall
  become: true
  roles:
    - role: common
      vars:
        sysctl_settings:
          net.ipv4.ip_forward: 1
          net.ipv6.conf.all.disable_ipv6: 1
          net.ipv6.conf.default.disable_ipv6: 1
    - firewall

# Step 2: Configure Pi-hole (DNS)
- name: Setup Pi-hole
  hosts: homelab-pihole
  become: true
  roles:
    - common
    - pihole

# Step 3: Configure VPN (Headscale)
- name: Setup Headscale
  hosts: homelab-vpn
  become: true
  roles:
    - common
    - vpn

# Step 4: Create headscale user + preauth key (runs on VPN VM)
- name: Prepare headscale for firewall join
  hosts: homelab-vpn
  become: true
  tasks:
    - name: Wait for headscale to be ready
      ansible.builtin.command: headscale version
      register: hs_ready
      retries: 5
      delay: 3
      until: hs_ready.rc == 0

    - name: Create headscale user
      ansible.builtin.command: headscale users create homelab-firewall-01
      register: user_create
      changed_when: "'User created' in user_create.stdout"
      failed_when: "user_create.rc != 0 and 'UNIQUE constraint' not in user_create.stderr"

    - name: Get firewall user ID
      ansible.builtin.shell: headscale users list --output json | python3 -c "import sys,json; users=json.load(sys.stdin); print(next(u['id'] for u in users if u['name']=='homelab-firewall-01'))"
      register: user_id_result
      changed_when: false

    - name: Create preauth key
      ansible.builtin.command: "headscale preauthkeys create --user {{ user_id_result.stdout | trim }} --reusable --expiration 1h"
      register: preauth_result
      changed_when: true

    - name: Store preauth key
      ansible.builtin.set_fact:
        firewall_preauth_key: "{{ preauth_result.stdout | trim }}"

# Step 5: Join firewall to tailnet (runs on firewall)
- name: Join firewall to Headscale tailnet
  hosts: homelab-firewall
  become: true
  vars:
    headscale_internal_url: "https://vpn.bricoo.fr:8080"
    advertise_routes:
      - "10.10.0.0/24"
      - "10.20.0.0/24"
      - "10.30.0.0/24"
      - "10.40.0.0/16"
      - "192.168.10.0/29"
  tasks:
    - name: Join headscale tailnet
      ansible.builtin.command: "tailscale up --login-server={{ headscale_internal_url }} --authkey={{ hostvars['homelab-vpn']['firewall_preauth_key'] }} --accept-routes --advertise-routes={{ advertise_routes | join(',') }} --hostname=homelab-firewall-01"
      changed_when: true
