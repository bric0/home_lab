---
# Called with stack variable
# stack = { name: "adguard", endpoint_name: "homelab-adguard", compose_content: "<yaml>" }

- name: "Get endpoint ID for {{ stack.endpoint_name }}"
  ansible.builtin.uri:
    url: "{{ portainer_api_url }}/endpoints"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    validate_certs: "{{ portainer_api_validate_certs }}"
  register: _stack_endpoints

- name: "Set endpoint ID for {{ stack.endpoint_name }}"
  ansible.builtin.set_fact:
    _stack_endpoint_id: >-
      {{ (_stack_endpoints.json | selectattr('Name', 'equalto', stack.endpoint_name) | first).Id }}

- name: "List existing stacks"
  ansible.builtin.uri:
    url: "{{ portainer_api_url }}/stacks"
    method: GET
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    validate_certs: "{{ portainer_api_validate_certs }}"
  register: _existing_stacks

- name: "Check if stack {{ stack.name }} exists"
  ansible.builtin.set_fact:
    _stack_exists: "{{ _existing_stacks.json | selectattr('Name', 'equalto', stack.name) | list | length > 0 }}"
    _stack_id: >-
      {{ (_existing_stacks.json | selectattr('Name', 'equalto', stack.name) | map(attribute='Id') | first) | default('') }}

- name: "Create stack {{ stack.name }}"
  ansible.builtin.uri:
    url: "{{ portainer_api_url }}/stacks/create/standalone/string?endpointId={{ _stack_endpoint_id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    body_format: json
    body:
      Name: "{{ stack.name }}"
      StackFileContent: "{{ stack.compose_content }}"
    validate_certs: "{{ portainer_api_validate_certs }}"
    status_code: [200]
  when: not _stack_exists | bool

- name: "Update stack {{ stack.name }}"
  ansible.builtin.uri:
    url: "{{ portainer_api_url }}/stacks/{{ _stack_id }}?endpointId={{ _stack_endpoint_id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ portainer_jwt }}"
    body_format: json
    body:
      StackFileContent: "{{ stack.compose_content }}"
      Prune: true
      PullImage: true
    validate_certs: "{{ portainer_api_validate_certs }}"
    status_code: [200]
  when: _stack_exists | bool
